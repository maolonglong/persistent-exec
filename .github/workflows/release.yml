name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to validate or recover
        required: true
      source_ref:
        description: Tag or commit to build (required only when recovering a release)
        required: false
      artifact_run_id:
        description: Original workflow run whose artifacts should be reused during recovery
        required: false
      publish:
        description: Publish a recovery run after validation
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            package: persistent-exec-bin-darwin-arm64
            builder: cargo
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package: persistent-exec-bin-darwin-x64
            builder: cargo
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: persistent-exec-bin-linux-x64-gnu
            builder: cargo
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            package: persistent-exec-bin-linux-x64-musl
            builder: cross
            rustflags: -C target-feature=-crt-static
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            package: persistent-exec-bin-linux-arm64-gnu
            builder: cross
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            package: persistent-exec-bin-linux-arm64-musl
            builder: cross
            rustflags: -C target-feature=-crt-static
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: persistent-exec-bin-win32-x64
            builder: cargo
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            package: persistent-exec-bin-win32-arm64
            builder: cargo
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.builder == 'cross'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Build native library
        shell: bash
        run: ${{ matrix.builder }} build --release --locked -p persistent-exec-ffi --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - run: node scripts/stage-native.mjs ${{ matrix.target }} ${{ matrix.package }}
      - run: mkdir -p artifacts
        shell: bash
      - run: npm pack ./packages/${{ matrix.package }} --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: artifacts/*.tgz

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Native optional packages do not exist in npm until the first release.
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: mkdir -p artifacts
      - run: npm pack ./packages/persistent-exec-node --pack-destination artifacts
      - run: npm pack ./packages/persistent-exec-bun --pack-destination artifacts
      - run: npm pack ./packages/pi-unified-exec --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-packages
          path: artifacts/*.tgz

  verify:
    needs: [native, javascript]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/publish-packages.mjs artifacts "$RELEASE_TAG"
        env:
          PUBLISH_DRY_RUN: "1"

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft; then
            test "$(cat draft)" = true || {
              echo "GitHub Release $RELEASE_TAG is already public; refusing to overwrite it." >&2
              exit 1
            }
            gh release delete "$RELEASE_TAG" --yes
          fi
          node scripts/release-notes.mjs "${RELEASE_TAG#v}" > release-notes.md
          gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file release-notes.md

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: [native, javascript, verify, github-release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/publish-packages.mjs artifacts "$RELEASE_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  cleanup-draft-release:
    if: ${{ always() && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) && needs.publish.result == 'failure' }}
    needs: [github-release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete failed draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true; then
            gh release delete "$RELEASE_TAG" --yes
          fi
